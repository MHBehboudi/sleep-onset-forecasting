<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="Helvetica, Arial, sans-serif">
<title>SENTINEL training pipeline</title>
<desc>Pretraining, cross-fitted lookahead teachers, distilled students, timescale members, ensemble.</desc>
<rect id="background" x="0" y="0" width="1280" height="640" rx="14" fill="#fcfcfb" stroke="#e3e2dd" stroke-width="1"/>
<text x="40" y="48" font-size="24" font-weight="bold" fill="#1d1d1b" text-anchor="start">How the seven members are trained</text>
<text x="40" y="74" font-size="14" font-weight="normal" fill="#52514e" text-anchor="start">Every training stream passes through the test-condition simulator (random opening cut, channel faults, gain changes).</text>
<g id="data">
<rect x="40" y="110" width="230" height="120" rx="8" fill="#ffffff" stroke="#8a8984" stroke-width="1.2"/>
<text x="56" y="134" font-size="14" font-weight="bold" fill="#1d1d1b" text-anchor="start">Muse sleep-onset data</text>
<text x="56" y="154" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">540 at-home nights, 203 people</text>
<text x="56" y="170" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">4 channels, 128 Hz</text>
<text x="56" y="186" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">label: first N2 (1–25 min)</text>
<text x="56" y="202" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">+ 300 s after onset per night</text>
<rect x="40" y="250" width="230" height="120" rx="8" fill="#ffffff" stroke="#8a8984" stroke-width="1.2"/>
<text x="56" y="274" font-size="14" font-weight="bold" fill="#1d1d1b" text-anchor="start">External PSG episodes</text>
<text x="56" y="294" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">PhysioNet 2018, BOAS, HMC</text>
<text x="56" y="310" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">wake → N2 transitions, mapped</text>
<text x="56" y="326" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">onto Muse electrode slots;</text>
<text x="56" y="342" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">missing slots marked bad</text>
</g>
<g id="stage-1">
<rect x="320" y="250" width="250" height="120" rx="8" fill="#efeeea" stroke="#8a8984" stroke-width="1.3"/>
<circle cx="342" cy="274" r="13" fill="#8a8984" stroke="none" stroke-width="1"/>
<text x="342" y="279" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
<text x="364" y="280" font-size="15" font-weight="bold" fill="#1d1d1b" text-anchor="start">Pretrain</text>
<text x="336" y="306" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">no-FM network, 10 epochs</text>
<text x="336" y="323" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">on PSG onset episodes</text>
<text x="336" y="340" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">zero-shot on Muse: 39.3 s</text>
</g>
<g id="stage-2">
<rect x="320" y="110" width="560" height="120" rx="8" fill="#e6effb" stroke="#2a78d6" stroke-width="1.3"/>
<circle cx="342" cy="134" r="13" fill="#2a78d6" stroke="none" stroke-width="1"/>
<text x="342" y="139" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
<text x="364" y="140" font-size="15" font-weight="bold" fill="#1d1d1b" text-anchor="start">Lookahead teachers (cross-fitted)</text>
<text x="336" y="166" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">same network + FM, but target shifted:</text>
<text x="336" y="183" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">at packet k it predicts the countdown</text>
<text x="336" y="200" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">as of k − 6, so it sees 30 s of future</text>
<rect x="640" y="150" width="104" height="34" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1"/>
<text x="692" y="172" font-size="12" font-weight="bold" fill="#1d1d1b" text-anchor="middle">teacher A</text>
<rect x="760" y="150" width="104" height="34" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1"/>
<text x="812" y="172" font-size="12" font-weight="bold" fill="#1d1d1b" text-anchor="middle">teacher B</text>
<text x="692" y="202" font-size="11" font-weight="normal" fill="#52514e" text-anchor="middle">fits fold 1</text>
<text x="812" y="202" font-size="11" font-weight="normal" fill="#52514e" text-anchor="middle">fits fold 2</text>
<text x="752" y="222" font-size="11" font-weight="bold" fill="#2a78d6" text-anchor="middle">each labels only the other fold</text>
</g>
<g id="stage-3">
<rect x="620" y="250" width="260" height="120" rx="8" fill="#e6effb" stroke="#2a78d6" stroke-width="1.3"/>
<circle cx="642" cy="274" r="13" fill="#2a78d6" stroke="none" stroke-width="1"/>
<text x="642" y="279" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
<text x="664" y="280" font-size="15" font-weight="bold" fill="#1d1d1b" text-anchor="start">Students (×5)</text>
<text x="636" y="306" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">causal, + frozen FM, all 540 Muse nights</text>
<text x="636" y="323" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">25 epochs, loss + L1 to teacher curve</text>
<text x="636" y="340" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">3 seeds + 2 with 3× near weight</text>
</g>
<g id="stage-4">
<rect x="320" y="400" width="560" height="100" rx="8" fill="#efedfb" stroke="#6b5fc7" stroke-width="1.3"/>
<circle cx="342" cy="424" r="13" fill="#6b5fc7" stroke="none" stroke-width="1"/>
<text x="342" y="429" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
<text x="364" y="430" font-size="15" font-weight="bold" fill="#1d1d1b" text-anchor="start">Selective-timescale members (×2)</text>
<text x="336" y="456" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">from scratch, 60 epochs, no FM. One with the latency-score loss geometry,</text>
<text x="336" y="473" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">one with short-prefix (cold-start) training; both with a delay-ranking term.</text>
</g>
<g id="stage-5">
<rect x="930" y="110" width="310" height="390" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1.3"/>
<circle cx="952" cy="134" r="13" fill="#52514e" stroke="none" stroke-width="1"/>
<text x="952" y="139" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
<text x="974" y="140" font-size="15" font-weight="bold" fill="#1d1d1b" text-anchor="start">Ensemble + ship</text>
<text x="946" y="168" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">equal-weight mean of 7 members</text>
<text x="946" y="185" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">monotone output map at 75% strength</text>
<text x="946" y="202" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">(fitted by participant cross-validation)</text>
<text x="946" y="240" font-size="13" font-weight="bold" fill="#1d1d1b" text-anchor="start">Packaging gates</text>
<text x="946" y="262" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">single-file predictor</text>
<text x="946" y="281" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">streaming = batch (max diff &lt; 1e-4 s)</text>
<text x="946" y="300" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">GPU device test on a CUDA node</text>
<text x="946" y="319" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">runtime estimated on the target GPU</text>
<rect x="946" y="372" width="278" height="110" rx="8" fill="#e6effb" stroke="#2a78d6" stroke-width="1.2"/>
<text x="960" y="396" font-size="13" font-weight="bold" fill="#1d1d1b" text-anchor="start">Blind-test result</text>
<text x="960" y="430" font-size="30" font-weight="bold" fill="#2a78d6" text-anchor="start">33.52 s</text>
<text x="960" y="456" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">W-bMAE on the blind test set</text>
<text x="960" y="473" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">2,956 s of the 3,600 s budget</text>
</g>
<g id="simulator-band">
<rect x="40" y="530" width="1200" height="76" rx="8" fill="#ffffff" stroke="#1baf7a" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="56" y="556" font-size="14" font-weight="bold" fill="#1d1d1b" text-anchor="start">Test-condition simulator (applied to every training stream)</text>
<text x="56" y="580" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">opening cut U(0, 15 min) on 90% of streams · 40% get one fault: dead (25%), mid-night dropout (20%), packet loss (15%), impedance noise (15%), drift (10%),</text>
<text x="56" y="597" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">motion bursts (10%), two dead channels (5%) · global gain ×0.4–2.5 · per-channel gain · DC jumps and NaN packets · the fault mask trains the reliability head</text>
</g>
<g id="connections">
<path d="M 270 310 L 318 310" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 318 310 L 310.0 305.6 L 310.0 314.4 Z" fill="#52514e" stroke="none"/>
<path d="M 270 170 L 318 170" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 318 170 L 310.0 165.6 L 310.0 174.4 Z" fill="#52514e" stroke="none"/>
<path d="M 445 250 L 445 232" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 445 232 L 440.6 240.0 L 449.4 240.0 Z" fill="#52514e" stroke="none"/>
<path d="M 570 310 L 618 310" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 618 310 L 610.0 305.6 L 610.0 314.4 Z" fill="#52514e" stroke="none"/>
<path d="M 750 230 L 750 248" fill="none" stroke="#2a78d6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 750 248 L 754.4 240.0 L 745.6 240.0 Z" fill="#2a78d6" stroke="none"/>
<text x="758" y="244" font-size="11" font-weight="normal" fill="#2a78d6" text-anchor="start">teacher curves</text>
<path d="M 880 310 L 928 310" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 928 310 L 920.0 305.6 L 920.0 314.4 Z" fill="#52514e" stroke="none"/>
<path d="M 880 450 L 928 450" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 928 450 L 920.0 445.6 L 920.0 454.4 Z" fill="#52514e" stroke="none"/>
<path d="M 270 190 L 296 190 L 296 450 L 318 450" fill="none" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 318 450 L 310.0 445.6 L 310.0 454.4 Z" fill="#52514e" stroke="none"/>
</g>
</svg>
