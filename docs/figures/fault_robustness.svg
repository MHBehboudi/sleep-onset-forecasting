<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="Helvetica, Arial, sans-serif">
<title>Fault robustness</title>
<desc>Development W-bMAE under single channel faults, 300 s opening cut: previous fixed-layout model vs SENTINEL.</desc>
<rect id="background" x="0" y="0" width="1100" height="560" rx="14" fill="#fcfcfb" stroke="#e3e2dd" stroke-width="1"/>
<text x="40" y="48" font-size="22" font-weight="bold" fill="#1d1d1b" text-anchor="start">One faulty electrode used to cost up to 57 s. SENTINEL loses under 1 s.</text>
<text x="40" y="72" font-size="13" font-weight="normal" fill="#52514e" text-anchor="start">W-bMAE (s, lower is better) on 128 held-out development nights, opening 300 s withheld, one fault per night on a random channel</text>
<g id="legend">
<rect x="40" y="92" width="14" height="10" rx="2" fill="#eb6834" stroke="#eb6834" stroke-width="1"/>
<text x="60" y="102" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">previous model (fixed 4-channel layout, blind-test 41.94)</text>
<rect x="420" y="92" width="14" height="10" rx="2" fill="#2a78d6" stroke="#2a78d6" stroke-width="1"/>
<text x="440" y="102" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">SENTINEL, one seed</text>
</g>
<g id="grid">
<line x1="290.0" y1="112" x2="290.0" y2="462" stroke="#e6e5e0" stroke-width="1"/>
<text x="290.0" y="480" font-size="12" font-weight="normal" fill="#8a8984" text-anchor="middle">0</text>
<line x1="440.0" y1="112" x2="440.0" y2="462" stroke="#e6e5e0" stroke-width="1"/>
<text x="440.0" y="480" font-size="12" font-weight="normal" fill="#8a8984" text-anchor="middle">20</text>
<line x1="590.0" y1="112" x2="590.0" y2="462" stroke="#e6e5e0" stroke-width="1"/>
<text x="590.0" y="480" font-size="12" font-weight="normal" fill="#8a8984" text-anchor="middle">40</text>
<line x1="740.0" y1="112" x2="740.0" y2="462" stroke="#e6e5e0" stroke-width="1"/>
<text x="740.0" y="480" font-size="12" font-weight="normal" fill="#8a8984" text-anchor="middle">60</text>
<line x1="890.0" y1="112" x2="890.0" y2="462" stroke="#e6e5e0" stroke-width="1"/>
<text x="890.0" y="480" font-size="12" font-weight="normal" fill="#8a8984" text-anchor="middle">80</text>
<line x1="1040.0" y1="112" x2="1040.0" y2="462" stroke="#e6e5e0" stroke-width="1"/>
<text x="1040.0" y="480" font-size="12" font-weight="normal" fill="#8a8984" text-anchor="middle">100</text>
<text x="665.0" y="502" font-size="12" font-weight="normal" fill="#52514e" text-anchor="middle">W-bMAE (s)</text>
</g>
<g id="bars">
<text x="276" y="137" font-size="13" font-weight="bold" fill="#1d1d1b" text-anchor="end">no fault</text>
<path d="M 290 120 L 568.25 120 Q 571.25 120 571.25 123 L 571.25 131 Q 571.25 134 568.25 134 L 290 134 Z" fill="#eb6834" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="577.25" y="131" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">37.5</text>
<path d="M 290 136 L 555.8 136 Q 558.8 136 558.8 139 L 558.8 147 Q 558.8 150 555.8 150 L 290 150 Z" fill="#2a78d6" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="564.8" y="147" font-size="12" font-weight="bold" fill="#1d1d1b" text-anchor="start">35.8</text>
<text x="276" y="187" font-size="13" font-weight="normal" fill="#1d1d1b" text-anchor="end">one channel + 30 µV noise</text>
<path d="M 290 170 L 996.275 170 Q 999.275 170 999.275 173 L 999.275 181 Q 999.275 184 996.275 184 L 290 184 Z" fill="#eb6834" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1005.275" y="181" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">94.6</text>
<path d="M 290 186 L 560.525 186 Q 563.525 186 563.525 189 L 563.525 197 Q 563.525 200 560.525 200 L 290 200 Z" fill="#2a78d6" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="569.525" y="197" font-size="12" font-weight="bold" fill="#1d1d1b" text-anchor="start">36.5</text>
<text x="276" y="237" font-size="13" font-weight="normal" fill="#1d1d1b" text-anchor="end">gain ×0.5 or ×2</text>
<path d="M 290 220 L 702.65 220 Q 705.65 220 705.65 223 L 705.65 231 Q 705.65 234 702.65 234 L 290 234 Z" fill="#eb6834" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="711.65" y="231" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">55.4</text>
<path d="M 290 236 L 556.1 236 Q 559.1 236 559.1 239 L 559.1 247 Q 559.1 250 556.1 250 L 290 250 Z" fill="#2a78d6" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="565.1" y="247" font-size="12" font-weight="bold" fill="#1d1d1b" text-anchor="start">35.9</text>
<text x="276" y="287" font-size="13" font-weight="normal" fill="#1d1d1b" text-anchor="end">one channel dead</text>
<path d="M 290 270 L 683.525 270 Q 686.525 270 686.525 273 L 686.525 281 Q 686.525 284 683.525 284 L 290 284 Z" fill="#eb6834" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="692.525" y="281" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">52.9</text>
<path d="M 290 286 L 561.35 286 Q 564.35 286 564.35 289 L 564.35 297 Q 564.35 300 561.35 300 L 290 300 Z" fill="#2a78d6" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="570.35" y="297" font-size="12" font-weight="bold" fill="#1d1d1b" text-anchor="start">36.6</text>
<text x="276" y="337" font-size="13" font-weight="normal" fill="#1d1d1b" text-anchor="end">channel drops out mid-night</text>
<path d="M 290 320 L 658.025 320 Q 661.025 320 661.025 323 L 661.025 331 Q 661.025 334 658.025 334 L 290 334 Z" fill="#eb6834" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="667.025" y="331" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">49.5</text>
<path d="M 290 336 L 554.45 336 Q 557.45 336 557.45 339 L 557.45 347 Q 557.45 350 554.45 350 L 290 350 Z" fill="#2a78d6" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="563.45" y="347" font-size="12" font-weight="bold" fill="#1d1d1b" text-anchor="start">35.7</text>
<text x="276" y="387" font-size="13" font-weight="normal" fill="#1d1d1b" text-anchor="end">motion bursts</text>
<path d="M 290 370 L 587.375 370 Q 590.375 370 590.375 373 L 590.375 381 Q 590.375 384 587.375 384 L 290 384 Z" fill="#eb6834" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="596.375" y="381" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">40.0</text>
<path d="M 290 386 L 553.475 386 Q 556.475 386 556.475 389 L 556.475 397 Q 556.475 400 553.475 400 L 290 400 Z" fill="#2a78d6" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="562.475" y="397" font-size="12" font-weight="bold" fill="#1d1d1b" text-anchor="start">35.5</text>
<text x="276" y="437" font-size="13" font-weight="normal" fill="#1d1d1b" text-anchor="end">impedance drift ×1 → ×3</text>
<path d="M 290 420 L 583.325 420 Q 586.325 420 586.325 423 L 586.325 431 Q 586.325 434 583.325 434 L 290 434 Z" fill="#eb6834" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="592.325" y="431" font-size="12" font-weight="normal" fill="#52514e" text-anchor="start">39.5</text>
<path d="M 290 436 L 556.7 436 Q 559.7 436 559.7 439 L 559.7 447 Q 559.7 450 556.7 450 L 290 450 Z" fill="#2a78d6" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<text x="565.7" y="447" font-size="12" font-weight="bold" fill="#1d1d1b" text-anchor="start">36.0</text>
<line x1="290" y1="112" x2="290" y2="462" stroke="#8a8984" stroke-width="1"/>
</g>
<text x="40" y="538" font-size="11" font-weight="normal" fill="#8a8984" text-anchor="start" font-style="italic">Source: SENTINEL design study, single faults streamed through each packaged predictor (probe outputs in the research log).</text>
</svg>
